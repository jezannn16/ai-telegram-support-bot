name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Tests and Ruff · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and linter
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Run offline and mocked integration tests
        run: python -m unittest discover -v
      - name: Evaluate synthetic retrieval cases
        run: python app.py --db "$RUNNER_TEMP/support-eval.sqlite3" eval --report "$RUNNER_TEMP/support-evaluation.json"
      - name: Evaluate LLM adapter contracts with fake transport
        run: python app.py --db "$RUNNER_TEMP/support-rag-eval.sqlite3" rag-eval --report "$RUNNER_TEMP/support-rag-eval.json"
