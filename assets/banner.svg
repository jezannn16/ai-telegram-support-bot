      <stop offset="1" stop-color="#B7F36B"/>
    </linearGradient>
    <pattern id="support-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#9CAAC2" stroke-opacity=".055"/>
    </pattern>
  </defs>
