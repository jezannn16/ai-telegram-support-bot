[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-telegram-support-bot"
version = "0.1.0"
description = "Offline FAQ retrieval and support ticket workflow prototype"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.17,<1"]

[project.scripts]
ai-telegram-support-bot = "app:main"
support-bot-telegram = "telegram_bot:main"

[tool.setuptools]
py-modules = ["app", "migrations", "telegram_api", "telegram_runtime", "telegram_bot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F"]
